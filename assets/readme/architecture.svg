<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-label="CampusIQ architecture: everything runs on your device; AI is optional and goes straight to the provider you chose">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#120E29"/><stop offset="1" stop-color="#0F1B2E"/></linearGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94A3B8"/></marker>
<style>
.t{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif}
.d{stroke-dasharray:5 7;animation:f 1.1s linear infinite}
@keyframes f{to{stroke-dashoffset:-24}}
.pop{animation:pop .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.pulse{animation:pl 3s ease-in-out infinite}
@keyframes pl{0%,100%{opacity:.55}50%{opacity:1}}
</style>
</defs>
<rect width="1200" height="640" rx="24" fill="url(#bg)"/>
