<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="AI import pipeline: attach, ask, extract, review, save">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#120E29"/><stop offset="1" stop-color="#17123A"/>
    </linearGradient>
    <linearGradient id="track" gradientUnits="userSpaceOnUse" x1="150" y1="0" x2="1050" y2="0">
      <stop offset="0" stop-color="#A78BFA"/><stop offset="0.5" stop-color="#FCD34D"/><stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>
    <style>
      .t{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif}
      .node{animation:pop 5s ease-in-out infinite}
      @keyframes pop{0%,100%{transform:scale(1)}8%{transform:scale(1.08)}16%{transform:scale(1)}}
      .n1{animation-delay:0s}.n2{animation-delay:1s}.n3{animation-delay:2s}.n4{animation-delay:3s}.n5{animation-delay:4s}
      .dash{stroke-dasharray:6 10;animation:flow 1.2s linear infinite}
      @keyframes flow{to{stroke-dashoffset:-32}}
    </style>
  </defs>
  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="24" fill="none" stroke="#A78BFA" stroke-opacity="0.3"/>

  <text x="600" y="44" text-anchor="middle" class="t" font-size="20" font-weight="700" fill="#FFFFFF">From a screenshot to saved data — with you in control</text>

  <path id="p" d="M150 150 H1050" stroke="url(#track)" stroke-opacity="0.25" stroke-width="6" stroke-linecap="round" fill="none"/>
  <path d="M150 150 H1050" stroke="url(#track)" stroke-width="3" fill="none" class="dash"/>


  <g class="t">
    <!-- 1 attach -->
    <g transform="translate(150 150)"><g class="node n1">
      <circle r="44" fill="#1F1747" stroke="#A78BFA" stroke-width="2"/>
      <rect x="-16" y="-20" width="32" height="40" rx="5" fill="none" stroke="#DDD6FE" stroke-width="2.5"/>
      <path d="M-9 8 L-2 0 L4 6 L9 1" fill="none" stroke="#A78BFA" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="5" cy="-9" r="3" fill="#FCD34D"/>
    </g>
      <text y="78" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">Attach</text>
      <text y="100" text-anchor="middle" font-size="13" fill="#C4B5FD">timetable / marksheet</text>
    </g>
    <!-- 2 ask -->
    <g transform="translate(375 150)"><g class="node n2">
      <circle r="44" fill="#1F1747" stroke="#C4B5FD" stroke-width="2"/>
      <path d="M-20 -14 H20 A6 6 0 0 1 26 -8 V8 A6 6 0 0 1 20 14 H-4 L-14 22 V14 H-20 A6 6 0 0 1 -26 8 V-8 A6 6 0 0 1 -20 -14 Z" fill="none" stroke="#DDD6FE" stroke-width="2.5" stroke-linejoin="round"/>
      <circle cx="-10" cy="0" r="2.5" fill="#FFFFFF"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.2s" repeatCount="indefinite"/></circle>
      <circle cx="0" cy="0" r="2.5" fill="#FFFFFF"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.2s" begin="0.2s" repeatCount="indefinite"/></circle>
      <circle cx="10" cy="0" r="2.5" fill="#FFFFFF"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.2s" begin="0.4s" repeatCount="indefinite"/></circle>
    </g>
      <text y="78" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">Ask naturally</text>
      <text y="100" text-anchor="middle" font-size="13" fill="#C4B5FD">“add these classes”</text>
    </g>
    <!-- 3 gemma -->
    <g transform="translate(600 150)"><g class="node n3">
      <circle r="52" fill="#2A1D12" stroke="#FCD34D" stroke-width="2"/>
      <circle r="52" fill="none" stroke="#FCD34D" stroke-width="2" stroke-opacity="0.5">
        <animate attributeName="r" values="52;70" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="0.6;0" dur="2s" repeatCount="indefinite"/>
      </circle>
      <path d="M0 -24 L6 -6 L24 0 L6 6 L0 24 L-6 6 L-24 0 L-6 -6 Z" fill="#FCD34D">
        <animateTransform attributeName="transform" type="rotate" values="0;45;0" dur="4s" repeatCount="indefinite"/>
      </path>
    </g>
      <text y="86" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">Gemma extracts</text>
      <text y="108" text-anchor="middle" font-size="13" fill="#FDE68A">structured proposal</text>
    </g>
    <!-- 4 review -->
    <g transform="translate(825 150)"><g class="node n4">
      <circle r="44" fill="#13253A" stroke="#7DD3FC" stroke-width="2"/>
      <rect x="-18" y="-20" width="36" height="40" rx="5" fill="none" stroke="#BAE6FD" stroke-width="2.5"/>
      <path d="M-10 -8 H10 M-10 0 H10 M-10 8 H2" stroke="#7DD3FC" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="10" cy="12" r="9" fill="#13253A" stroke="#FCD34D" stroke-width="2.5"/>
      <path d="M16 18 L22 24" stroke="#FCD34D" stroke-width="3" stroke-linecap="round"/>
    </g>
      <text y="78" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">You review</text>
      <text y="100" text-anchor="middle" font-size="13" fill="#BAE6FD">fix issues · confirm labs</text>
    </g>
    <!-- 5 save -->
    <g transform="translate(1050 150)"><g class="node n5">
      <circle r="44" fill="#0F2A22" stroke="#34D399" stroke-width="2"/>
      <path d="M-16 0 L-5 12 L17 -12" fill="none" stroke="#6EE7B7" stroke-opacity="0.25" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M-16 0 L-5 12 L17 -12" fill="none" stroke="#6EE7B7" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="50" stroke-dashoffset="50">
        <animate attributeName="stroke-dashoffset" values="50;50;0;0" keyTimes="0;0.8;0.9;1" dur="5s" repeatCount="indefinite"/>
      </path>
    </g>
      <text y="78" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">Saved safely</text>
      <text y="100" text-anchor="middle" font-size="13" fill="#A7F3D0">validated · rollback on fail</text>
    </g>
  </g>
  <!-- travelling packet -->
  <g>
    <circle r="9" fill="#FFFFFF" filter="url(#glow)"/>
    <circle r="5" fill="#FFFFFF"/>
    <animateMotion dur="5s" repeatCount="indefinite" path="M150 150 H1050" keyPoints="0;1" keyTimes="0;1" calcMode="linear"/>
  </g>
</svg>
