<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Deployment and data boundaries: static builds, visitor-local data, AI straight to the provider">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0E1F1A"/><stop offset="1" stop-color="#121A33"/></linearGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94A3B8"/></marker>
<style>
.t{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif}
.d{stroke-dasharray:5 7;animation:f 1.1s linear infinite}
@keyframes f{to{stroke-dashoffset:-24}}
.pop{animation:pop .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.pulse{animation:pl 3s ease-in-out infinite}
@keyframes pl{0%,100%{opacity:.55}50%{opacity:1}}
</style>
</defs>
<rect width="1200" height="420" rx="24" fill="url(#bg)"/>
<rect x=".5" y=".5" width="1199" height="419" rx="24" fill="none" stroke="#34D399" stroke-opacity=".3"/>
<text x="600" y="40" text-anchor="middle" class="t" font-size="20" font-weight="800" fill="#FFFFFF">Builds, hosting and where data lives</text>
<g class="pop" style="animation-delay:0s"><rect x="30.0" y="108.0" width="200" height="64" rx="14" fill="#A78BFA" fill-opacity=".14" stroke="#A78BFA" stroke-opacity=".75" stroke-width="1.6"/><text x="130" y="136" text-anchor="middle" class="t" font-size="15" font-weight="700" fill="#FFFFFF">🐙 GitHub main</text><text x="130" y="156" text-anchor="middle" class="t" font-size="12" fill="#CBD5E1">source of truth</text></g>
<g class="pop" style="animation-delay:0.1s"><rect x="285.0" y="65.0" width="230" height="60" rx="14" fill="#34D399" fill-opacity=".14" stroke="#34D399" stroke-opacity=".75" stroke-width="1.6"/><text x="400" y="91" text-anchor="middle" class="t" font-size="15" font-weight="700" fill="#FFFFFF">Render static build</text><text x="400" y="111" text-anchor="middle" class="t" font-size="12" fill="#CBD5E1">npm run build:web</text></g>
<g class="pop" style="animation-delay:0.2s"><rect x="285.0" y="160.0" width="230" height="60" rx="14" fill="#A78BFA" fill-opacity=".14" stroke="#A78BFA" stroke-opacity=".75" stroke-width="1.6"/><text x="400" y="186" text-anchor="middle" class="t" font-size="15" font-weight="700" fill="#FFFFFF">⚙️ GitHub Actions</text><text x="400" y="206" text-anchor="middle" class="t" font-size="12" fill="#CBD5E1">Release workflow</text></g>
<g class="pop" style="animation-delay:0.3s"><rect x="565.0" y="65.0" width="230" height="60" rx="14" fill="#34D399" fill-opacity=".14" stroke="#34D399" stroke-opacity=".75" stroke-width="1.6"/><text x="680" y="91" text-anchor="middle" class="t" font-size="15" font-weight="700" fill="#FFFFFF">🌐 Public HTTPS site</text><text x="680" y="111" text-anchor="middle" class="t" font-size="12" fill="#CBD5E1">static files only</text></g>
<g class="pop" style="animation-delay:0.4s"><rect x="565.0" y="160.0" width="230" height="60" rx="14" fill="#FCD34D" fill-opacity=".14" stroke="#FCD34D" stroke-opacity=".75" stroke-width="1.6"/><text x="680" y="186" text-anchor="middle" class="t" font-size="15" font-weight="700" fill="#FFFFFF">📦 GitHub Release</text><text x="680" y="206" text-anchor="middle" class="t" font-size="12" fill="#CBD5E1">APK · IPA · web.zip</text></g>
<g class="pop" style="animation-delay:0.5s"><rect x="845.0" y="65.0" width="230" height="60" rx="14" fill="#7DD3FC" fill-opacity=".14" stroke="#7DD3FC" stroke-opacity=".75" stroke-width="1.6"/><text x="960" y="91" text-anchor="middle" class="t" font-size="15" font-weight="700" fill="#FFFFFF">Visitor browser</text><text x="960" y="111" text-anchor="middle" class="t" font-size="12" fill="#CBD5E1">its own local records</text></g>
<g class="pop" style="animation-delay:0.6s"><rect x="845.0" y="160.0" width="230" height="60" rx="14" fill="#7DD3FC" fill-opacity=".14" stroke="#7DD3FC" stroke-opacity=".75" stroke-width="1.6"/><text x="960" y="186" text-anchor="middle" class="t" font-size="15" font-weight="700" fill="#FFFFFF">📱 Phone app</text><text x="960" y="206" text-anchor="middle" class="t" font-size="12" fill="#CBD5E1">its own local records</text></g>
<path d="M230 130 L285 103" fill="none" stroke="#34D399" stroke-opacity=".22" stroke-width="5" stroke-linecap="round"/><path d="M230 130 L285 103" fill="none" stroke="#34D399" stroke-width="2" class="d" marker-end="url(#ah)"/><g><circle r="6" fill="#34D399" filter="url(#glow)"/><circle r="3.5" fill="#fff"/><animateMotion dur="1.6s" begin="0s" repeatCount="indefinite" path="M230 130 L285 103"/></g>
<path d="M230 150 L285 182" fill="none" stroke="#A78BFA" stroke-opacity=".22" stroke-width="5" stroke-linecap="round"/><path d="M230 150 L285 182" fill="none" stroke="#A78BFA" stroke-width="2" class="d" marker-end="url(#ah)"/><g><circle r="6" fill="#A78BFA" filter="url(#glow)"/><circle r="3.5" fill="#fff"/><animateMotion dur="1.6s" begin="0.4s" repeatCount="indefinite" path="M230 150 L285 182"/></g>
<path d="M515 95 H565" fill="none" stroke="#34D399" stroke-opacity=".22" stroke-width="5" stroke-linecap="round"/><path d="M515 95 H565" fill="none" stroke="#34D399" stroke-width="2" class="d" marker-end="url(#ah)"/><g><circle r="6" fill="#34D399" filter="url(#glow)"/><circle r="3.5" fill="#fff"/><animateMotion dur="1.2s" begin="0.2s" repeatCount="indefinite" path="M515 95 H565"/></g>
<path d="M515 190 H565" fill="none" stroke="#A78BFA" stroke-opacity=".22" stroke-width="5" stroke-linecap="round"/><path d="M515 190 H565" fill="none" stroke="#A78BFA" stroke-width="2" class="d" marker-end="url(#ah)"/><g><circle r="6" fill="#A78BFA" filter="url(#glow)"/><circle r="3.5" fill="#fff"/><animateMotion dur="1.2s" begin="0.6s" repeatCount="indefinite" path="M515 190 H565"/></g>
<path d="M795 95 H845" fill="none" stroke="#34D399" stroke-opacity=".22" stroke-width="5" stroke-linecap="round"/><path d="M795 95 H845" fill="none" stroke="#34D399" stroke-width="2" class="d" marker-end="url(#ah)"/><g><circle r="6" fill="#34D399" filter="url(#glow)"/><circle r="3.5" fill="#fff"/><animateMotion dur="1.2s" begin="0.4s" repeatCount="indefinite" path="M795 95 H845"/></g>
<path d="M795 190 H845" fill="none" stroke="#FCD34D" stroke-opacity=".22" stroke-width="5" stroke-linecap="round"/><path d="M795 190 H845" fill="none" stroke="#FCD34D" stroke-width="2" class="d" marker-end="url(#ah)"/><g><circle r="6" fill="#FCD34D" filter="url(#glow)"/><circle r="3.5" fill="#fff"/><animateMotion dur="1.2s" begin="0.8s" repeatCount="indefinite" path="M795 190 H845"/></g>
<g class="pop" style="animation-delay:0.7s"><rect x="700.0" y="305.0" width="240" height="60" rx="14" fill="#FCD34D" fill-opacity=".14" stroke="#FCD34D" stroke-opacity=".75" stroke-width="1.6"/><text x="820" y="331" text-anchor="middle" class="t" font-size="15" font-weight="700" fill="#FFFFFF">☁️ Google API / Gemma</text><text x="820" y="351" text-anchor="middle" class="t" font-size="12" fill="#CBD5E1">user-entered key</text></g>
<g class="pop" style="animation-delay:0.8s"><rect x="980.0" y="305.0" width="200" height="60" rx="14" fill="#34D399" fill-opacity=".14" stroke="#34D399" stroke-opacity=".75" stroke-width="1.6"/><text x="1080" y="331" text-anchor="middle" class="t" font-size="15" font-weight="700" fill="#FFFFFF">💻 Mac + Ollama</text><text x="1080" y="351" text-anchor="middle" class="t" font-size="12" fill="#CBD5E1">trusted Wi-Fi</text></g>
<path d="M850 112 L775 302" fill="none" stroke="#FCD34D" stroke-opacity=".22" stroke-width="5" stroke-linecap="round"/><path d="M850 112 L775 302" fill="none" stroke="#FCD34D" stroke-width="2" class="d" marker-end="url(#ah)"/><g><circle r="6" fill="#FCD34D" filter="url(#glow)"/><circle r="3.5" fill="#fff"/><animateMotion dur="2.2s" begin="0.3s" repeatCount="indefinite" path="M850 112 L775 302"/></g>
<path d="M990 222 L1060 302" fill="none" stroke="#34D399" stroke-opacity=".22" stroke-width="5" stroke-linecap="round"/><path d="M990 222 L1060 302" fill="none" stroke="#34D399" stroke-width="2" class="d" marker-end="url(#ah)"/><g><circle r="6" fill="#34D399" filter="url(#glow)"/><circle r="3.5" fill="#fff"/><animateMotion dur="2.2s" begin="0.9s" repeatCount="indefinite" path="M990 222 L1060 302"/></g>
<path d="M910 222 L860 302" fill="none" stroke="#FCD34D" stroke-opacity=".22" stroke-width="5" stroke-linecap="round"/><path d="M910 222 L860 302" fill="none" stroke="#FCD34D" stroke-width="2" class="d" marker-end="url(#ah)"/><g><circle r="6" fill="#FCD34D" filter="url(#glow)"/><circle r="3.5" fill="#fff"/><animateMotion dur="2.2s" begin="1.4s" repeatCount="indefinite" path="M910 222 L860 302"/></g>
<g class="pulse"><rect x="40" y="300" width="560" height="96" rx="18" fill="#FFFFFF" fill-opacity=".04" stroke="#34D399" stroke-opacity=".45"/></g><text x="60" y="330" text-anchor="start" class="t" font-size="13" font-weight="600" fill="#34D399">✓ No shared database: every visitor and phone keeps separate records</text>
<text x="60" y="356" text-anchor="start" class="t" font-size="13" font-weight="600" fill="#34D399">✓ No bundled API key: AI needs the user's own key or Mac</text>
<text x="60" y="382" text-anchor="start" class="t" font-size="13" font-weight="600" fill="#34D399">✓ Render serves files only: no model, no app server</text>
</svg>
