<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-label="3rd place at Hacktoberfest 2026">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2A1A06"/><stop offset="0.5" stop-color="#1E1550"/><stop offset="1" stop-color="#2A1A06"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F5C9A0"/><stop offset="1" stop-color="#9A5B2C"/></linearGradient>
    <linearGradient id="sh" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFF" stop-opacity="0"/><stop offset="0.5" stop-color="#FFF" stop-opacity="0.18"/><stop offset="1" stop-color="#FFF" stop-opacity="0"/></linearGradient>
    <clipPath id="c"><rect width="1200" height="150" rx="22"/></clipPath>
    <style>.t{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif}</style>
  </defs>
  <g clip-path="url(#c)">
    <rect width="1200" height="150" fill="url(#bg)"/>
    <rect y="0" width="240" height="150" fill="url(#sh)" transform="skewX(-20)">
      <animate attributeName="x" values="-300;1500" dur="4s" repeatCount="indefinite"/>
    </rect>
    <!-- confetti -->
    <g>
      <rect x="120" y="-10" width="6" height="12" fill="#FCD34D"><animate attributeName="y" values="-10;160" dur="3.2s" repeatCount="indefinite"/></rect>
      <rect x="300" y="-10" width="6" height="12" fill="#A78BFA"><animate attributeName="y" values="-10;160" dur="4s" begin="1s" repeatCount="indefinite"/></rect>
      <rect x="880" y="-10" width="6" height="12" fill="#34D399"><animate attributeName="y" values="-10;160" dur="3.6s" begin=".5s" repeatCount="indefinite"/></rect>
      <rect x="1060" y="-10" width="6" height="12" fill="#F472B6"><animate attributeName="y" values="-10;160" dur="4.4s" begin="1.6s" repeatCount="indefinite"/></rect>
      <rect x="980" y="-10" width="6" height="12" fill="#FCD34D"><animate attributeName="y" values="-10;160" dur="3s" begin="2s" repeatCount="indefinite"/></rect>
    </g>
    <!-- trophy -->
    <g transform="translate(420 75)">
      <g>
        <animateTransform attributeName="transform" type="rotate" values="-6;6;-6" dur="3s" repeatCount="indefinite"/>
        <path d="M-24 -36 H24 V-10 A24 24 0 0 1 -24 -10 Z" fill="url(#gold)"/>
        <path d="M-24 -30 H-36 A12 14 0 0 0 -22 -4 M24 -30 H36 A12 14 0 0 1 22 -4" fill="none" stroke="#E3A671" stroke-width="4"/>
        <rect x="-5" y="12" width="10" height="12" fill="#9A5B2C"/>
        <rect x="-18" y="24" width="36" height="9" rx="3" fill="url(#gold)"/>
        <text x="0" y="-12" text-anchor="middle" class="t" font-size="20" font-weight="800" fill="#5A3416">3</text>
        <path opacity="0" d="M0 -28 L3 -21 L10 -20 L5 -15 L6 -8 L0 -12 L-6 -8 L-5 -15 L-10 -20 L-3 -21 Z" fill="#FFF8DB"/>
      </g>
    </g>
    <text x="480" y="66" class="t" font-size="15" font-weight="700" fill="#F5C9A0" letter-spacing="4">HACKTOBERFEST 2026 · PODIUM FINISH</text>
    <text x="480" y="106" class="t" font-size="38" font-weight="800" fill="#FFFFFF">3rd Place 🥉</text>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="149" rx="22" fill="none" stroke="#E3A671" stroke-opacity="0.55"/>
</svg>
